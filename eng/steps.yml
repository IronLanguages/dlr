parameters:
  os: ''

steps:
  - powershell: |

     $xml = [xml] (Get-Content CurrentVersion.props)
     $major = $xml.Project.PropertyGroup.MajorVersion
     $minor = $xml.Project.PropertyGroup.MinorVersion
     $micro = $xml.Project.PropertyGroup.MicroVersion
     $serial = $xml.Project.PropertyGroup.ReleaseSerial
     $level = $xml.Project.PropertyGroup.ReleaseLevel

     if($level -eq 'final') {
         $PackageVersion = "$major.$minor.$micro"
     } elseif($level -ne 'final' -or $serial -ne '0') {
         $PackageVersion = "$major.$minor.$micro-$level$serial"
     }

     # store the package version to an environment variable
     Write-Host ("##vso[task.setvariable variable=PackageVersion;isSecret=false;isOutput=true;]$PackageVersion")
    displayName: Grab Package Version

  - task: UseDotNet@2
    displayName: Install .NET 11.0 SDK for build
    inputs:
      packageType: 'sdk'
      version: '11.0.x'

  - task: UseDotNet@2
    displayName: Install .NET 10.0 SDK for testing
    inputs:
      packageType: 'sdk'
      version: '10.0.x'

  - task: UseDotNet@2
    displayName: Install .NET 9.0 runtime for testing
    inputs:
      packageType: 'runtime'
      version: '9.0.x'

  - task: UseDotNet@2
    displayName: Install .NET 8.0 runtime for testing
    inputs:
      packageType: 'runtime'
      version: '8.0.x'

  # Setup Mono (the runner images no longer include it)
  - ${{ if ne(parameters.os, 'Windows') }}:
    - bash: |
        if [ "${{ parameters.os }}" = Linux ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          echo "##vso[task.prependpath]$HOMEBREW_PREFIX/bin"
        fi
        brew install mono
        mono --version
      displayName: Install Mono

  # Dump version info
  - script: dotnet --info
    displayName: Version Information

  - powershell: ./make.ps1
    displayName: Build

  - powershell: ./make.ps1 package
    displayName: Package

  - task: CopyFiles@2
    displayName: Copy Artifact Files
    inputs:
      SourceFolder: '$(Build.Repository.LocalPath)/dist/Release/Packages'
      Contents: |
       **/*.nupkg
       **/*.snupkg
       **/*.zip
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

  - task: CopyFiles@2
    displayName: Copy Build Logs
    inputs:
      Contents: '*.binlog'
      TargetFolder: '$(Build.ArtifactStagingDirectory)'
    condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

  - task: PublishBuildArtifacts@1
    displayName: Publish Artifacts
    inputs:
      ArtifactName: ${{ format('{0} Artifacts', parameters.os) }}
    condition: and(succeededOrFailed(), eq(variables['system.pullrequest.isfork'], false))

  - powershell: ./make.ps1 -frameworks net11.0 test-all
    displayName: Test (net11.0)
  - powershell: ./make.ps1 -frameworks net10.0 test-all
    displayName: Test (net10.0)
  - powershell: ./make.ps1 -frameworks net9.0 test-all
    displayName: Test (net9.0)
  - powershell: ./make.ps1 -frameworks net8.0 test-all
    displayName: Test (net8.0)
  - pwsh: |
      # the .NET 11 SDK no longer runs .NET Framework tests on Mono
      if (!$IsWindows) { '{ "sdk": { "version": "10.0.100", "rollForward": "latestFeature" } }' | Set-Content global.json }
      ./make.ps1 -frameworks net462 test-all
    displayName: Test (net462)

  - task: PublishTestResults@2
    displayName: Publish Test Results
    inputs:
      testRunner: VSTest
      testResultsFiles: '**/*.trx'
      mergeTestResults: true
      testRunTitle: ${{ parameters.os }}
    condition: succeededOrFailed()


